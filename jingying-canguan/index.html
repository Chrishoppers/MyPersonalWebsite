<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>梦想小馆 · 经营原型</title>
<style>
  :root{ --pink:#ff9ac2; --mint:#7ef0c0; --sky:#7ee8fa; --violet:#a78bfa; --gold:#ffd66b; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; touch-action:manipulation; }
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    background:#f6f0fa; color:#5b4a66; user-select:none; -webkit-user-select:none;
  }
  #app{ position:fixed; top:0; bottom:0; left:0; right:0; margin:0 auto; max-width:560px; box-shadow:0 0 50px rgba(120,80,160,.20); }
  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:rgba(255,255,255,.8); backdrop-filter:blur(8px);
    box-shadow:0 2px 8px rgba(120,80,160,.08);
  }
  .stat{ display:flex; align-items:center; gap:4px; font-weight:800; font-size:15px;
    background:#fff; border-radius:999px; padding:6px 12px; box-shadow:0 2px 6px rgba(0,0,0,.06); }
  .stat .ico{ font-size:17px; }
  #levelStat{ margin-left:auto; }
  #repStat{ color:#ff8fb3; }
  #comboStat{ color:#ff8fb3; font-weight:900; opacity:0; transition:opacity .2s; }
  #stage{ position:absolute; inset:0; overflow:hidden; }
  canvas{ display:block; position:absolute; inset:0; }
  #toast{
    position:absolute; left:50%; top:14%; transform:translateX(-50%); z-index:4;
    font-weight:800; font-size:16px; color:#7a5aa0; background:rgba(255,255,255,.9);
    padding:10px 20px; border-radius:999px; box-shadow:0 6px 20px rgba(120,80,160,.2);
    opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; white-space:nowrap;
  }
  #toast.on{ opacity:1; transform:translateX(-50%) translateY(-6px); }
  #hint{
    position:absolute; left:50%; bottom:170px; transform:translateX(-50%); z-index:4;
    font-size:13px; font-weight:700; color:#8a6f96; background:rgba(255,255,255,.85);
    padding:8px 16px; border-radius:999px; pointer-events:none;
  }
  #shop{
    position:absolute; bottom:0; left:0; right:0; z-index:10;
    background:rgba(255,255,255,.9); backdrop-filter:blur(8px);
    border-top:1px solid rgba(120,80,160,.1); padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 10px rgba(120,80,160,.08);
  }
  #shop .title{ font-size:12px; font-weight:800; color:#a88cc0; margin:2px 4px 6px; }
  #shopRow{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .card{
    flex:0 0 auto; min-width:96px; max-width:120px; background:#fff; border-radius:14px;
    padding:8px 10px; box-shadow:0 2px 8px rgba(0,0,0,.06); display:flex; flex-direction:column; gap:3px;
  }
  .card .name{ font-size:12px; font-weight:800; }
  .card .desc{ font-size:10px; color:#a08ab0; line-height:1.3; min-height:26px; }
  .card .buy{
    margin-top:2px; border:none; cursor:pointer; font-family:inherit; font-weight:800; font-size:12px;
    color:#fff; background:linear-gradient(135deg,#ffb36b,#ff8f6b); border-radius:999px; padding:7px 0;
    box-shadow:0 2px 6px rgba(255,143,107,.3);
  }
  .card .buy:disabled{ background:#e5dded; color:#b8a8c8; box-shadow:none; cursor:default; }
  .card .buy.bought{ background:linear-gradient(135deg,#7ef0c0,#4fd6a5); color:#fff; }
  #offline{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:5; display:none;
    background:#fff; border-radius:20px; padding:24px 28px; text-align:center;
    box-shadow:0 16px 50px rgba(0,0,0,.25); max-width:80vw;
  }
  #offline .big{ font-size:34px; } #offline .t1{ font-size:17px; font-weight:800; margin:8px 0 4px; }
  #offline .t2{ font-size:13px; color:#a08ab0; margin-bottom:14px; }
  #offline button{ border:none; cursor:pointer; font-family:inherit; font-weight:800; font-size:15px; color:#fff;
    background:linear-gradient(135deg,#7ee8fa,#4fa8e0); padding:11px 26px; border-radius:999px; }
  #err{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:9; background:#fff; border-radius:16px;
    padding:20px 24px; max-width:86vw; font-size:13px; box-shadow:0 10px 40px rgba(0,0,0,.2); display:none; color:#c0392b; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="stat"><span class="ico">💰</span><span id="coinsVal">0</span></div>
    <div class="stat"><span class="ico">⭐</span><span id="levelVal">1</span></div>
    <div class="stat" id="repStat"><span class="ico">❤️</span><span id="repVal">5</span></div>
    <div class="stat" id="comboStat"><span class="ico">🔥</span>连击 x<span id="comboVal">1</span></div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="toast"></div>
    <div id="hint">👆 点击顾客开始做菜 · 攒钱升级小馆</div>
    <div id="offline">
      <div class="big">🍯</div>
      <div class="t1">欢迎回来！</div>
      <div class="t2">离线收益 <b id="offlineAmt">0</b> 金币</div>
      <button id="offlineBtn">领取</button>
    </div>
    <div id="err"></div>
  </div>
  <div id="shop">
    <div class="title">🛠️ 升级小馆</div>
    <div id="shopRow"></div>
  </div>
</div>

<script>
'use strict';
(function(){
  // ============ 数据 ============
  var dishes = [
    { name:'小笼包', emoji:'🥟', price:5,  unlock:1 },
    { name:'拉面',   emoji:'🍜', price:10, unlock:2 },
    { name:'炸鸡',   emoji:'🍗', price:18, unlock:3 },
    { name:'汉堡',   emoji:'🍔', price:28, unlock:4 },
    { name:'寿司',   emoji:'🍣', price:40, unlock:5 },
    { name:'草莓蛋糕', emoji:'🍰', price:60, unlock:6 }
  ];
  var faces = ['😀','🥰','😎','🤠','😌','🥳','😋','😊','🙂','😄'];
  var G = {
    coins: 20, level: 1, xp: 0, rep: 5,
    maxSeats: 3, cookLv: 0, menuLv: 0, decorLv: 0, chef: false,
    seats: [], spawnT: 0.6, combo: 1, lastServe: -10
  };

  // ============ 存档 ============
  var KEY = 'mxg_save_v1';
  function save(){ try{ G.lastSeen = Date.now(); localStorage.setItem(KEY, JSON.stringify(G)); }catch(e){} }
  function load(){
    var persist = ['coins','level','xp','rep','maxSeats','cookLv','menuLv','decorLv','chef'];
    try{
      var s = localStorage.getItem(KEY);
      if(s){
        var d = JSON.parse(s);
        for(var i=0;i<persist.length;i++){ var k=persist[i]; if(k in d) G[k]=d[k]; }
        return d.lastSeen || 0;
      }
    }catch(e){}
    return 0;
  }

  // ============ DOM ============
  var $ = function(id){ return document.getElementById(id); };
  var coinsEl=$('coinsVal'), levelEl=$('levelVal'), repEl=$('repVal'), comboEl=$('comboVal');
  var comboStat=$('comboStat'), toastEl=$('toast'), shopRow=$('shopRow');
  var canvas=$('c'), ctx=canvas.getContext('2d');
  var W=0, H=0, seatPos=[], TOP=0, BOT=0, counterY=0;

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    W = $('app').clientWidth || window.innerWidth; H = window.innerHeight;
    canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    TOP = $('topbar').offsetHeight || 0;
    BOT = $('shop').offsetHeight || 0;
    counterY = H - BOT - 60;
    layout();
  }

  // ============ 布局 ============
  function layout(){
    var n=G.seats.length;
    seatPos=[];
    var y = counterY - 30;
    var mx=W*0.13;
    for(var i=0;i<n;i++){
      var x = (n===1) ? W/2 : mx + (W-2*mx)*(i/(n-1));
      seatPos.push({x:x, y:y});
    }
  }
  function ensureSeats(){
    while(G.seats.length < G.maxSeats) G.seats.push({ cust:null });
    layout();
  }

  // ============ 数值 ============
  function cookTime(){ return Math.max(0.5, 2.5 * Math.pow(0.82, G.cookLv)); }
  function patience(){ return 9 + G.level*1.5; }
  function arrival(){ return Math.max(1.6, 4.5 - G.level*0.35); }
  function price(d){ return Math.round(d.price * (1 + G.menuLv*0.25)); }
  function xpToNext(){ return 60 * G.level; }
  function tipAmount(c){
    var ratio = c.patience / c.maxPat;
    return Math.round(Math.round(c.order.price * 0.6 * ratio) * (1 + G.decorLv*0.1));
  }

  // ============ 顾客 ============
  function spawnCustomer(i){
    var unlocked = dishes.filter(function(d){ return d.unlock <= G.level; });
    var order = unlocked[Math.floor(Math.random()*unlocked.length)];
    var pat = patience();
    G.seats[i].cust = {
      order: order, face: faces[Math.floor(Math.random()*faces.length)],
      patience: pat, maxPat: pat,
      cooking: G.chef, cookP: 0, cookTotal: cookTime()
    };
  }
  function serve(i){
    var c = G.seats[i].cust;
    var tip = tipAmount(c);
    var gain = price(c.order) + tip;
    // 连击
    var t = elapsed;
    G.combo = (t - G.lastServe < 2.5) ? G.combo+1 : 1;
    G.lastServe = t;
    var comboBonus = (G.combo>1) ? G.combo*2 : 0;
    gain += comboBonus;
    G.coins += gain;
    G.xp += c.order.price;
    G.seats[i].cust = null;
    burst(seatPos[i].x, seatPos[i].y-70, '💰', '+'+gain, '#ff9a3c');
    burst(seatPos[i].x, seatPos[i].y-90, '❤️', '', '#ff8fb3');
    if(G.combo>1) burst(seatPos[i].x, seatPos[i].y-110, '🔥', 'x'+G.combo, '#ff8f6b');
    // 升级
    while(G.xp >= xpToNext()){
      G.xp -= xpToNext();
      G.level++;
      G.rep = Math.min(5, G.rep+1);
      toast('⭐ 升级！小馆 Lv.'+G.level);
      var newly = dishes.filter(function(d){ return d.unlock === G.level; });
      if(newly.length) toast(newly[0].emoji+' 新菜品解锁：'+newly[0].name);
    }
    refresh(); save();
  }
  function angry(i){
    var c = G.seats[i].cust;
    G.seats[i].cust = null;
    G.rep = Math.max(1, G.rep-1);
    burst(seatPos[i].x, seatPos[i].y-70, '💢', '', '#ff5f7e');
    refresh();
  }

  // ============ 更新 ============
  function update(dt){
    G.spawnT -= dt;
    if(G.spawnT <= 0){
      G.spawnT = arrival();
      var free=-1;
      for(var k=0;k<G.seats.length;k++){ if(!G.seats[k].cust){ free=k; break; } }
      if(free>=0) spawnCustomer(free);
    }
    for(var i=0;i<G.seats.length;i++){
      var c=G.seats[i].cust;
      if(!c) continue;
      if(c.cooking){
        c.cookP += dt;
        if(c.cookP >= c.cookTotal){ serve(i); continue; }
      }
      c.patience -= dt;
      if(c.patience <= 0){ angry(i); continue; }
    }
  }

  // ============ 渲染 ============
  var particles=[];
  function burst(x,y,emoji,text,color){
    particles.push({ x:x, y:y, emoji:emoji, text:text, color:color, life:0, max:1.1, vy:-60 });
  }
  function updateParticles(dt){
    for(var i=particles.length-1;i>=0;i--){
      var p=particles[i];
      p.life+=dt;
      if(p.life>=p.max){ particles.splice(i,1); continue; }
      p.y += p.vy*dt;
      p.vy *= (1-2*dt);
      var k=1-p.life/p.max;
      ctx.globalAlpha = Math.min(1, k*2);
      ctx.font = 'bold 22px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
      ctx.textAlign='center';
      if(p.text){ ctx.fillStyle=p.color; ctx.font='bold 16px "PingFang SC","Segoe UI",sans-serif'; ctx.fillText(p.text, p.x, p.y); }
      else { ctx.fillText(p.emoji, p.x, p.y); }
    }
    ctx.globalAlpha=1;
  }

  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function drawBG(){
    var wallY = H*0.52; // 墙面/地面分界
    // 墙壁
    var wg=ctx.createLinearGradient(0,0,0,wallY);
    wg.addColorStop(0,'#ffe9d8'); wg.addColorStop(1,'#ffe2cd');
    ctx.fillStyle=wg; ctx.fillRect(0,0,W,wallY);
    // 窗户（带云朵）
    ctx.fillStyle='#c8e9ff'; rr(W*0.60, H*0.09, W*0.32, H*0.20, 12); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(W*0.68, H*0.14, 14, 0, Math.PI*2); ctx.arc(W*0.74, H*0.13, 11, 0, Math.PI*2); ctx.arc(W*0.82, H*0.15, 12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=5; rr(W*0.60, H*0.09, W*0.32, H*0.20, 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W*0.76, H*0.09); ctx.lineTo(W*0.76, H*0.29); ctx.stroke();
    // 挂钟
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(W*0.16, H*0.16, 26, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#c9a2e0'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(W*0.16, H*0.16, 26, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle='#8a6f96'; ctx.fillRect(W*0.16-2, H*0.16-20, 4, 18); ctx.fillRect(W*0.16-2, H*0.16-2, 14, 4);
    // 墙面木条
    ctx.strokeStyle='rgba(180,140,100,0.10)'; ctx.lineWidth=2;
    for(var i=1;i<=4;i++){ var wy=wallY*i/5; ctx.beginPath(); ctx.moveTo(0,wy); ctx.lineTo(W,wy); ctx.stroke(); }
    // 地面（瓷砖）
    var fg=ctx.createLinearGradient(0,wallY,0,H);
    fg.addColorStop(0,'#f4e9da'); fg.addColorStop(1,'#ead9c4');
    ctx.fillStyle=fg; ctx.fillRect(0,wallY,W,H-wallY);
    ctx.strokeStyle='rgba(150,120,90,0.12)'; ctx.lineWidth=2;
    for(var j=1;j<=4;j++){ var fx=W*j/5; ctx.beginPath(); ctx.moveTo(fx,wallY); ctx.lineTo(fx,H); ctx.stroke(); }
    // 挂灯（暖光）
    for(var k=1;k<=3;k++){
      var lx=W*k/4, ly=H*0.05;
      ctx.fillStyle='rgba(255,214,107,0.95)'; ctx.beginPath(); ctx.arc(lx,ly,9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(120,80,160,0.25)'; ctx.fillRect(lx-1,ly-16,2,16);
    }
    // 柜台
    ctx.fillStyle='#ffe8d6'; rr(-20, counterY, W+40, H-counterY+20, 18); ctx.fill();
    ctx.fillStyle='#ffd9b8'; rr(-20, counterY, W+40, 26, 12); ctx.fill();
    ctx.fillStyle='rgba(180,130,90,0.15)';
    for(var m=0;m<3;m++){ ctx.fillRect(-20, counterY+8+m*5, W+40, 2); }
  }
  function drawSeat(x,y){
    ctx.fillStyle='#c9a2e0';
    ctx.beginPath(); ctx.ellipse(x,y,34,16,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#b58fd0';
    ctx.fillRect(x-16, y-30, 32, 6);
  }
  function drawCustomer(i){
    var s=seatPos[i], c=G.seats[i].cust;
    if(!c) { drawSeat(s.x,s.y); return; }
    drawSeat(s.x,s.y);
    var hx=s.x, hy=s.y-86;
    // 身体
    ctx.fillStyle='#fff'; rr(hx-22, hy+26, 44, 40, 16); ctx.fill();
    // 头
    var grad=ctx.createRadialGradient(hx-6,hy-8,4,hx,hy,32);
    grad.addColorStop(0,'#ffe9b8'); grad.addColorStop(1,'#ffd08a');
    ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(hx,hy,30,0,Math.PI*2); ctx.fill();
    // 表情
    ctx.font='28px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(c.face, hx, hy+2);
    ctx.textBaseline='alphabetic';
    // 点单气泡
    var bx=hx, by=hy-58;
    ctx.fillStyle='#fff'; rr(bx-26, by-20, 52, 40, 14); ctx.fill();
    ctx.strokeStyle='rgba(120,80,160,0.15)'; ctx.lineWidth=1.5; rr(bx-26, by-20, 52, 40, 14); ctx.stroke();
    ctx.font='24px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; ctx.textAlign='center';
    ctx.fillText(c.order.emoji, bx, by+4);
    // 耐心条
    var pr = Math.max(0, c.patience/c.maxPat);
    var pw=48;
    ctx.fillStyle='rgba(0,0,0,0.10)'; rr(hx-pw/2, hy+60, pw, 7, 4); ctx.fill();
    ctx.fillStyle = pr>0.5 ? '#7ef0c0' : (pr>0.25 ? '#ffd66b' : '#ff8f8f');
    if(pr>0) rr(hx-pw/2, hy+60, pw*pr, 7, 4), ctx.fill();
    // 做菜进度环
    if(c.cooking){
      var prog = Math.min(1, c.cookP/c.cookTotal);
      ctx.strokeStyle='#7ee8fa'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.arc(hx,hy,38,-Math.PI/2, -Math.PI/2 + prog*Math.PI*2); ctx.stroke();
      ctx.font='14px "Segoe UI Emoji",sans-serif'; ctx.textAlign='center';
      ctx.fillText('🍳', hx, hy-52);
    } else {
      // 待接单提示
      ctx.font='13px "Segoe UI Emoji",sans-serif'; ctx.textAlign='center';
      ctx.fillText('👆', hx, hy-52);
    }
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    drawBG();
    for(var i=0;i<seatPos.length;i++) drawCustomer(i);
  }

  // ============ HUD / 商店 ============
  function refresh(){
    coinsEl.textContent = G.coins;
    levelEl.textContent = G.level;
    repEl.textContent = G.rep;
    var comboActive = (elapsed - G.lastServe < 2.5) && G.combo>1;
    comboStat.style.opacity = comboActive ? '1':'0';
    comboEl.textContent = G.combo;
    renderShop();
  }
  function renderShop(){
    var items = [
      { key:'cookLv', name:'🍳 灶台加速', desc:'出餐更快 (-18%/级)', cost:25*(G.cookLv+1), lv:G.cookLv, max:false, buy:function(){ G.cookLv++; } },
      { key:'seats', name:'🪑 加座位', desc:'多接待一位顾客', cost:60*(G.maxSeats-2), lv:G.maxSeats, max:(G.maxSeats>=6), buy:function(){ G.maxSeats++; ensureSeats(); } },
      { key:'menuLv', name:'📖 菜单升级', desc:'菜价 +25%/级', cost:50*(G.menuLv+1), lv:G.menuLv, max:false, buy:function(){ G.menuLv++; } },
      { key:'chef', name:'👨‍🍳 雇厨师', desc:'自动接单做菜', cost:150, lv:G.chef?1:0, max:G.chef, buy:function(){ G.chef=true; for(var i=0;i<G.seats.length;i++){ if(G.seats[i].cust && !G.seats[i].cust.cooking) G.seats[i].cust.cooking=true; } } },
      { key:'decorLv', name:'🎀 装饰升级', desc:'小费 +10%/级', cost:40*(G.decorLv+1), lv:G.decorLv, max:false, buy:function(){ G.decorLv++; } }
    ];
    shopRow.innerHTML='';
    items.forEach(function(it){
      var card=document.createElement('div'); card.className='card';
      var name=document.createElement('div'); name.className='name'; name.textContent=it.name+(it.max?'':(' Lv.'+it.lv));
      var desc=document.createElement('div'); desc.className='desc'; desc.textContent=it.desc;
      var btn=document.createElement('button'); btn.className='buy';
      if(it.max){ btn.textContent='已购'; btn.disabled=true; btn.classList.add('bought'); }
      else { btn.textContent='💰 '+it.cost; }
      btn.addEventListener('click', function(){
        if(it.max || G.coins < it.cost) return;
        G.coins -= it.cost;
        it.buy();
        toast(it.name.replace(/^[^\s]+\s/,'')+' 升级成功！');
        refresh(); save();
      });
      function updateAfford(){ if(!it.max) btn.disabled = G.coins < it.cost; }
      updateAfford();
      card.appendChild(name); card.appendChild(desc); card.appendChild(btn);
      shopRow.appendChild(card);
    });
  }
  var toastTimer=null;
  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ toastEl.classList.remove('on'); }, 1800);
  }

  // ============ 输入 ============
  canvas.addEventListener('pointerdown', function(e){
    var r=canvas.getBoundingClientRect();
    var x=e.clientX-r.left, y=e.clientY-r.top;
    for(var i=0;i<seatPos.length;i++){
      var s=seatPos[i];
      var dx=x-s.x, dy=y-(s.y-80);
      if(dx*dx+dy*dy < 70*70){
        var c=G.seats[i].cust;
        if(c && !c.cooking){ c.cooking=true; c.cookTotal=cookTime(); }
        return;
      }
    }
    // 兜底：点哪儿都行——给第一个待做菜的顾客开始做菜
    for(var j=0;j<G.seats.length;j++){
      var cc=G.seats[j].cust;
      if(cc && !cc.cooking){ cc.cooking=true; cc.cookTotal=cookTime(); return; }
    }
  });

  // ============ 离线收益 ============
  function offlineCheck(lastSeen){
    if(lastSeen){
      var el = (Date.now()-lastSeen)/1000;
      if(el > 60 && G.chef){
        var earn = Math.min(600, Math.floor(el * (0.6 + G.menuLv*0.2)));
        if(earn > 0){
          $('offlineAmt').textContent = earn;
          $('offline').style.display='block';
          $('offlineBtn').onclick=function(){
            G.coins += earn; $('offline').style.display='none'; refresh(); save();
          };
        }
      }
    }
  }
  window.addEventListener('beforeunload', save);
  setInterval(save, 5000);

  // ============ 主循环 ============
  var elapsed=0, lastT=performance.now();
  function frame(now){
    requestAnimationFrame(frame);
    var dt=Math.min((now-lastT)/1000, 0.05);
    lastT=now; elapsed+=dt;
    update(dt);
    var ca = (elapsed - G.lastServe < 2.5) && G.combo>1;
    comboStat.style.opacity = ca ? '1':'0';
    comboEl.textContent = G.combo;
    updateParticles(dt);
    render();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('error', function(e){
    var er=document.getElementById('err');
    if(er && e.message){ er.style.display='block'; er.textContent='⚠️ 出错了：' + e.message; }
  });

  var booted = false;
  function boot(){
    resize();
    if(W<=0 || H<=0){ requestAnimationFrame(boot); return; }
    if(booted) return;
    booted = true;
    var lastSeen = load();
    G.seats = [];
    ensureSeats();
    refresh();
    offlineCheck(lastSeen);
    requestAnimationFrame(frame);
  }
  if(document.readyState === 'complete' || document.readyState === 'interactive'){ requestAnimationFrame(boot); }
  else { window.addEventListener('load', function(){ requestAnimationFrame(boot); }); }
})();
</script>
</body>
</html>
