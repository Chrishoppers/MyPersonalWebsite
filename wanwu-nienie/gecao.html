<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>极限割草 · 解压实验室</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; touch-action:none; }
  body{ font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#cfe8c0; color:#4a6b3f; user-select:none; -webkit-user-select:none; }
  canvas{ display:block; position:fixed; inset:0; touch-action:none; }
  #hud{ position:fixed; inset:0; pointer-events:none; z-index:5; }
  #back{ position:absolute; left:14px; top:12px; pointer-events:auto; text-decoration:none; color:#4a6b3f;
    background:rgba(255,255,255,.7); padding:8px 14px; border-radius:999px; font-weight:700; font-size:13px; }
  #title{ position:absolute; top:14px; left:50%; transform:translateX(-50%); font-size:18px; font-weight:800; }
  #progress{ position:absolute; top:56px; left:50%; transform:translateX(-50%); width:min(280px,60vw); height:12px;
    background:rgba(255,255,255,.6); border-radius:999px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.1); }
  #bar{ height:100%; width:0%; background:linear-gradient(90deg,#7ee8a0,#4fd66b); border-radius:999px; transition:width .1s; }
  #hint{ position:absolute; bottom:24px; left:50%; transform:translateX(-50%); font-size:13px; font-weight:700; opacity:.85; white-space:nowrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <a id="back" href="index.html">← 实验室</a>
  <div id="title">✂️ 极限割草</div>
  <div id="progress"><div id="bar"></div></div>
  <div id="hint">按住拖动 · 划到哪儿剪到哪儿</div>
</div>
<script>
'use strict';
(function(){
  var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  var W=0,H=0;
  function resize(){ var dpr=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  window.addEventListener('resize',function(){ resize(); makeGrass(); }); resize();

  var grass=[], cutCount=0, total=0, particles=[], done=false, doneT=0;
  function makeGrass(){
    grass=[]; cutCount=0; total=0; done=false;
    var step=24;
    for(var y=step/2+6; y<H; y+=step){
      for(var x=step/2; x<W; x+=step){
        grass.push({ x:x+(Math.random()-0.5)*8, y:y+(Math.random()-0.5)*8, cut:false, lean:(Math.random()-0.5)*0.6 });
        total++;
      }
    }
  }
  makeGrass();

  var AC=null,master=null,noise=null;
  function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.4; master.connect(AC.destination);
    var len=AC.sampleRate*0.4, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0); for(var i=0;i<len;i++) d[i]=Math.random()*2-1; noise=b; }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
  function shh(){
    if(!AC) return; var t=AC.currentTime;
    var src=AC.createBufferSource(); src.buffer=noise; src.loop=true;
    var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(1400+Math.random()*800,t); f.frequency.exponentialRampToValueAtTime(500,t+0.12);
    var g=AC.createGain(); g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+0.16);
  }
  function chime(){
    if(!AC) return; var t=AC.currentTime;
    var o=AC.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(880,t+0.12); o.frequency.setValueAtTime(1100,t+0.24);
    var g=AC.createGain(); g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.52);
  }

  var pressing=false, px=0, py=0, lastCut=0;
  function cutAt(x,y){
    var R=42, cut=0;
    for(var i=0;i<grass.length;i++){
      var g=grass[i];
      if(g.cut) continue;
      var dx=g.x-x, dy=g.y-y;
      if(dx*dx+dy*dy < R*R){ g.cut=true; cut++; }
    }
    if(cut>0){
      cutCount+=cut;
      var now=performance.now();
      if(now-lastCut>90){ lastCut=now; shh(); }
      for(var k=0;k<Math.min(cut,6);k++) particles.push({ x:x+(Math.random()-0.5)*R, y:y+(Math.random()-0.5)*R, vx:(Math.random()-0.5)*160, vy:-120-Math.random()*140, life:0, max:0.5+Math.random()*0.4, r:2+Math.random()*3 });
    }
    if(cutCount>=total && !done){ done=true; doneT=performance.now(); chime(); }
  }
  canvas.addEventListener('pointerdown',function(e){ audio(); pressing=true; px=e.clientX; py=e.clientY; cutAt(px,py); });
  window.addEventListener('pointermove',function(e){ if(pressing){ px=e.clientX; py=e.clientY; cutAt(px,py); } });
  window.addEventListener('pointerup',function(){ pressing=false; });

  function draw(){
    // 地面
    ctx.fillStyle='#d9edc8'; ctx.fillRect(0,0,W,H);
    // 已割路径
    ctx.fillStyle='#e9f6dc';
    // 草
    for(var i=0;i<grass.length;i++){
      var g=grass[i];
      if(g.cut) continue;
      ctx.strokeStyle='#6fbf4e'; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(g.x, g.y);
      ctx.lineTo(g.x + g.lean*3, g.y-9);
      ctx.moveTo(g.x, g.y);
      ctx.lineTo(g.x - g.lean*3, g.y-7);
      ctx.stroke();
    }
    // 粒子（草屑）
    for(var k=particles.length-1;k>=0;k--){ var p=particles[k]; p.life+=0.016; if(p.life>=p.max){particles.splice(k,1);continue;} p.vy+=700*0.016; p.x+=p.vx*0.016; p.y+=p.vy*0.016; ctx.globalAlpha=1-p.life/p.max; ctx.fillStyle='#8fd66b'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
    // 割草机光标
    if(pressing){ ctx.strokeStyle='rgba(90,180,90,0.5)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(px,py,42,0,Math.PI*2); ctx.stroke(); }
    // 完成
    if(done){
      ctx.font='bold 40px "Segoe UI Emoji",sans-serif'; ctx.textAlign='center'; ctx.fillText('✨ 整齐划一！', W/2, H/2);
      if(performance.now()-doneT>1400){ makeGrass(); }
    }
    var pct = Math.round(cutCount/total*100);
    document.getElementById('bar').style.width = pct+'%';
  }
  function frame(){ requestAnimationFrame(frame); draw(); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
