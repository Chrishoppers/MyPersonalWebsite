<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>粉碎机 · 解压实验室</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; touch-action:none; }
  body{ font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(180deg,#3a3f55,#232838); color:#fff; user-select:none; -webkit-user-select:none; }
  canvas{ display:block; position:fixed; inset:0; touch-action:none; }
  #hud{ position:fixed; inset:0; pointer-events:none; z-index:5; }
  #back{ position:absolute; left:14px; top:12px; pointer-events:auto; text-decoration:none; color:#fff;
    background:rgba(255,255,255,.16); padding:8px 14px; border-radius:999px; font-weight:700; font-size:13px; }
  #title{ position:absolute; top:14px; left:50%; transform:translateX(-50%); font-size:18px; font-weight:800; }
  #hint{ position:absolute; bottom:90px; left:50%; transform:translateX(-50%); font-size:13px; opacity:.8; white-space:nowrap; }
  #btn{ position:absolute; bottom:20px; left:50%; transform:translateX(-50%); pointer-events:auto; border:none; cursor:pointer;
    font-family:inherit; font-weight:900; font-size:18px; color:#fff; background:linear-gradient(135deg,#ff8fb3,#ff5f7e);
    padding:14px 40px; border-radius:999px; box-shadow:0 6px 20px rgba(255,95,126,.4); }
  #btn:active{ transform:translateX(-50%) scale(.94); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <a id="back" href="index.html">← 实验室</a>
  <div id="title">🗜️ 粉碎机</div>
  <div id="hint">点「压」或按空格 · 液压机碾压一切</div>
  <button id="btn">💥 压！</button>
</div>
<script>
'use strict';
(function(){
  var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  var W=0,H=0,CX=0,topY=0,baseY=0;
  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    CX=W/2; topY=H*0.14; baseY=H*0.72;
  }
  window.addEventListener('resize',resize); resize();

  var items=['🦆','🧸','📱','🍅','🥚','🍩','🎈','🕶️','🧦','🐤'];
  var cols=['#ff8fb3','#ffd66b','#7ef0c0','#7ee8fa','#a78bfa','#ffb36b'];
  var S={ phase:'idle', pistonY:topY, item:0, particles:[], shake:0, t:0 };
  var timeScale=1;

  var AC=null,master=null,noise=null;
  function audio(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
      var len=AC.sampleRate*0.4, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0); for(var i=0;i<len;i++) d[i]=Math.random()*2-1; noise=b; }catch(e){} }
    if(AC&&AC.state==='suspended') AC.resume();
  }
  function crunch(){
    if(!AC) return; var t=AC.currentTime;
    var src=AC.createBufferSource(); src.buffer=noise; src.loop=true;
    var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(3000,t); f.frequency.exponentialRampToValueAtTime(120,t+0.25);
    var g=AC.createGain(); g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.32);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+0.35);
    var o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(40,t+0.25);
    var g2=AC.createGain(); g2.gain.setValueAtTime(0.5,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    o.connect(g2); g2.connect(master); o.start(t); o.stop(t+0.32);
  }
  function thunk(){
    if(!AC) return; var t=AC.currentTime;
    var o=AC.createOscillator(); o.type='square'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(60,t+0.06);
    var g=AC.createGain(); g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.09);
  }

  function crush(){ if(S.phase==='idle'){ audio(); thunk(); S.phase='down'; } }
  function impact(){
    var c=cols[Math.floor(Math.random()*cols.length)];
    for(var i=0;i<50;i++){
      var a=Math.random()*Math.PI*2, sp=120+Math.random()*620;
      S.particles.push({x:CX,y:baseY-40,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,life:0,max:0.5+Math.random()*0.7,r:2+Math.random()*6,c:c});
    }
    S.shake=16; timeScale=0.22; crunch();
    if(navigator.vibrate){ try{ navigator.vibrate([30,40,30]); }catch(e){} }
  }

  function update(dt,rawDt){
    S.t+=rawDt;
    if(S.phase==='down'){
      S.pistonY += dt*1600;
      if(S.pistonY>=baseY-16){ S.pistonY=baseY-16; impact(); S.phase='up'; }
    } else if(S.phase==='up'){
      S.pistonY -= dt*700;
      if(S.pistonY<=topY){ S.pistonY=topY; S.phase='idle'; S.item=(S.item+1+Math.floor(Math.random()*3))%items.length; }
    }
    for(var i=S.particles.length-1;i>=0;i--){ var p=S.particles[i]; p.life+=dt; if(p.life>=p.max){S.particles.splice(i,1);continue;} p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
    S.shake*=Math.pow(0.0001,rawDt);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    // 机器支架
    ctx.fillStyle='#4a5068'; ctx.fillRect(CX-90,0,180,topY-10); ctx.fillRect(CX-90,topY-10,180,16);
    ctx.fillStyle='#5a6078'; ctx.fillRect(CX-96,baseY-40,24,40); ctx.fillRect(CX+72,baseY-40,24,40);
    // 底座
    ctx.fillStyle='#6a7088'; ctx.fillRect(CX-110,baseY,220,22); ctx.fillRect(CX-100,baseY+22,200,10);
    // 活塞
    ctx.fillStyle='#8a90a8'; ctx.fillRect(CX-70,topY,140,S.pistonY-topY);
    ctx.fillStyle='#b0b6cc'; ctx.fillRect(CX-70,S.pistonY-16,140,16);
    // 待压物品
    if(S.phase==='idle' || S.phase==='down'){
      ctx.font='52px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(items[S.item], CX, baseY-46);
      ctx.textBaseline='alphabetic';
    }
    // 粒子
    for(var i=0;i<S.particles.length;i++){ var p=S.particles[i]; var k=1-p.life/p.max; ctx.globalAlpha=k; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.4,p.r*k),0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
  }
  function frame(now){
    requestAnimationFrame(frame);
    var rawDt=Math.min((now-lastT)/1000,0.05); lastT=now;
    timeScale+=(1-timeScale)*(1-Math.pow(0.001,rawDt));
    update(rawDt*timeScale, rawDt);
    ctx.save();
    if(S.shake>0.3) ctx.translate((Math.random()-0.5)*S.shake,(Math.random()-0.5)*S.shake);
    draw();
    ctx.restore();
  }
  var lastT=performance.now();
  document.getElementById('btn').addEventListener('click',crush);
  window.addEventListener('keydown',function(e){ if(e.code==='Space'){ e.preventDefault(); crush(); } });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
