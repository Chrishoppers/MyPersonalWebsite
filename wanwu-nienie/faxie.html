<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>发泄屋 · 解压实验室</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; touch-action:none; }
  body{ font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(180deg,#5a4a6e,#3f3550); color:#fff; user-select:none; -webkit-user-select:none; }
  canvas{ display:block; position:fixed; inset:0; touch-action:none; }
  #hud{ position:fixed; inset:0; pointer-events:none; z-index:5; }
  #back{ position:absolute; left:14px; top:12px; pointer-events:auto; text-decoration:none; color:#fff;
    background:rgba(255,255,255,.16); padding:8px 14px; border-radius:999px; font-weight:700; font-size:13px; }
  #title{ position:absolute; top:14px; left:50%; transform:translateX(-50%); font-size:18px; font-weight:800; }
  #score{ position:absolute; top:14px; right:14px; font-size:16px; font-weight:800; background:rgba(255,255,255,.16); padding:8px 14px; border-radius:999px; }
  #hint{ position:absolute; bottom:90px; left:50%; transform:translateX(-50%); font-size:13px; opacity:.85; white-space:nowrap; }
  #btn{ position:absolute; bottom:20px; left:50%; transform:translateX(-50%); pointer-events:auto; border:none; cursor:pointer;
    font-family:inherit; font-weight:900; font-size:18px; color:#fff; background:linear-gradient(135deg,#ff8f6b,#ff5f5f);
    padding:14px 40px; border-radius:999px; box-shadow:0 6px 20px rgba(255,95,95,.4); }
  #btn:active{ transform:translateX(-50%) scale(.94); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <a id="back" href="index.html">← 实验室</a>
  <div id="title">🔨 发泄屋</div>
  <div id="score">💥 <span id="n">0</span></div>
  <div id="hint">点东西砸碎它 · 或「全砸」一键粉碎</div>
  <button id="btn">💥 全砸</button>
</div>
<script>
'use strict';
(function(){
  var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  var W=0,H=0;
  function resize(){ var dpr=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); layout(); }
  window.addEventListener('resize',resize);

  var pool=['🍽️','🏺','📺','🖥️','🪞','🧸','🎸','⚱️','🫖','🎻','📻','🕰️','🎁','🐘'];
  var cols=['#ff8fb3','#ffd66b','#7ef0c0','#7ee8fa','#a78bfa','#ffb36b'];
  var objects=[], particles=[], shake=0, smashed=0;
  function layout(){
    objects=[];
    var rows=[[0.38],[0.66]];
    var n=Math.min(5, Math.max(3, Math.floor(W/120)));
    for(var r=0;r<rows.length;r++){
      var y=H*rows[r][0];
      for(var i=0;i<n;i++){
        var x=W*(i+1)/(n+1);
        objects.push({ x:x, y:y, emoji:pool[Math.floor(Math.random()*pool.length)], smashed:false, rt:0 });
      }
    }
  }
  resize();

  var AC=null,master=null,noise=null;
  function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
    var len=AC.sampleRate*0.4, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0); for(var i=0;i<len;i++) d[i]=Math.random()*2-1; noise=b; }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
  function smashSound(){
    if(!AC) return; var t=AC.currentTime;
    var src=AC.createBufferSource(); src.buffer=noise; src.loop=true;
    var f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.setValueAtTime(800,t); f.frequency.exponentialRampToValueAtTime(3000,t+0.06);
    var g=AC.createGain(); g.gain.setValueAtTime(0.7,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+0.18);
  }

  function smash(o){
    if(o.smashed) return;
    o.smashed=true; o.rt=performance.now()+1200; smashed++;
    document.getElementById('n').textContent=smashed;
    var c=cols[Math.floor(Math.random()*cols.length)];
    for(var i=0;i<26;i++){
      var a=Math.random()*Math.PI*2, sp=140+Math.random()*520;
      particles.push({ x:o.x, y:o.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-140, life:0, max:0.5+Math.random()*0.6, r:2+Math.random()*5, c:c, shard:Math.random()<0.4 });
    }
    shake=Math.min(shake+12,18); smashSound();
    if(navigator.vibrate){ try{ navigator.vibrate(20); }catch(e){} }
  }
  function hitTest(x,y){
    for(var i=0;i<objects.length;i++){ var o=objects[i]; if(!o.smashed){ var dx=x-o.x, dy=y-o.y; if(dx*dx+dy*dy < 52*52) return o; } }
    return null;
  }
  canvas.addEventListener('pointerdown',function(e){
    audio();
    var r=canvas.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    var o=hitTest(x,y); if(o) smash(o);
  });
  document.getElementById('btn').addEventListener('click',function(){ audio(); objects.forEach(function(o){ if(!o.smashed) smash(o); }); });

  function update(dt,rawDt){
    for(var i=0;i<objects.length;i++){ var o=objects[i]; if(o.smashed && performance.now()>o.rt){ o.smashed=false; o.emoji=pool[Math.floor(Math.random()*pool.length)]; } }
    for(var k=particles.length-1;k>=0;k--){ var p=particles[k]; p.life+=dt; if(p.life>=p.max){particles.splice(k,1);continue;} p.vy+=1000*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
    shake*=Math.pow(0.0001,rawDt);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    // 架子
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.fillRect(0,H*0.38-34,W,10); ctx.fillRect(0,H*0.66-34,W,10);
    // 物品
    for(var i=0;i<objects.length;i++){
      var o=objects[i];
      if(o.smashed) continue;
      ctx.font='44px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(o.emoji, o.x, o.y);
      ctx.textBaseline='alphabetic';
    }
    // 碎片粒子
    for(var k=0;k<particles.length;k++){ var p=particles[k]; var a=1-p.life/p.max; ctx.globalAlpha=a; ctx.fillStyle=p.c;
      if(p.shard){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.life*6); ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2); ctx.restore(); }
      else { ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.4,p.r*a),0,Math.PI*2); ctx.fill(); } }
    ctx.globalAlpha=1;
  }
  var lastT=performance.now();
  function frame(now){ requestAnimationFrame(frame); var rawDt=Math.min((now-lastT)/1000,0.05); lastT=now; update(rawDt,rawDt);
    ctx.save(); if(shake>0.3) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); draw(); ctx.restore(); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
