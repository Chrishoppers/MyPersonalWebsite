<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>解压实验室</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:auto; }
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #fdeff6 0%, #f4f0ff 50%, #e8f4ff 100%);
    color:#5b4a66; padding:28px 18px 60px; user-select:none; -webkit-user-select:none;
  }
  h1{ text-align:center; font-size:30px; margin:6px 0 2px; letter-spacing:1px; }
  .sub{ text-align:center; font-size:14px; color:#a08ab0; margin-bottom:26px; font-weight:600; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:16px; max-width:760px; margin:0 auto; }
  a.card{
    display:flex; flex-direction:column; align-items:center; gap:10px; text-decoration:none; color:#5b4a66;
    background:rgba(255,255,255,.85); border-radius:22px; padding:26px 14px;
    box-shadow:0 6px 20px rgba(150,100,180,.14); transition:transform .12s, box-shadow .2s;
  }
  a.card:hover{ transform:translateY(-4px); box-shadow:0 12px 30px rgba(150,100,180,.24); }
  a.card:active{ transform:scale(.96); }
  .emoji{ font-size:46px; }
  .name{ font-size:17px; font-weight:800; }
  .desc{ font-size:11px; color:#a08ab0; text-align:center; line-height:1.4; }
</style>
</head>
<body>
  <h1>🧪 解压实验室</h1>
  <div class="sub">5 种解压玩具台 · 点进去就开爽</div>
  <div class="grid">
    <a class="card" href="nienie.html">
      <div class="emoji">🫧</div>
      <div class="name">捏捏乐</div>
      <div class="desc">3D 软体，按哪儿凹哪儿</div>
    </a>
    <a class="card" href="fensuiji.html">
      <div class="emoji">🗜️</div>
      <div class="name">粉碎机</div>
      <div class="desc">液压机压碎一切</div>
    </a>
    <a class="card" href="gecao.html">
      <div class="emoji">✂️</div>
      <div class="name">极限割草</div>
      <div class="desc">划一下就整齐</div>
    </a>
    <a class="card" href="faxie.html">
      <div class="emoji">🔨</div>
      <div class="name">发泄屋</div>
      <div class="desc">砸碎所有东西</div>
    </a>
    <a class="card" href="qingli.html">
      <div class="emoji">🧽</div>
      <div class="name">治愈清理</div>
      <div class="desc">擦掉污渍，焕然一新</div>
    </a>
  </div>
</body>
</html>
