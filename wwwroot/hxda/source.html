    <script src="js/storage.js"></script>
    <script src="js/system-helper.js"></script>
    <script>
    (function () {
        var srcBody = document.getElementById('srcBody');

        function renderSource() {
            var lines = [
                '<span class="comment">&lt;!-- 节点7：归档完成。等待下一位。 --&gt;</span>',
                '<span class="comment">&lt;!-- 下一节点：无名者。 --&gt;</span>',
                '<span class="comment">&lt;!-- 如果你能看到这里，说明你不是留言者。 --&gt;</span>',
                '<span class="comment">&lt;!-- 你是阅读者。 --&gt;</span>',
                '<span class="comment">&lt;!-- 但阅读者也会被归档。 --&gt;</span>',
                '<span class="comment">&lt;!-- 第43页：不要回头。 --&gt;</span>',
                '<span class="comment">&lt;!-- EchoSystem v0.9 --&gt;</span>',
                '',
                '<span class="tag">&lt;html&gt;</span>',
                '<span class="tag">&lt;head&gt;</span>',
                '  <span class="tag">&lt;title&gt;</span>回响档案｜失物招领·留言簿<span class="tag">&lt;/title&gt;</span>',
                '  <span class="tag">&lt;meta</span> <span class="attr">name</span>=<span class="str">"data-key"</span> <span class="attr">content</span>=<span class="str">"2347"</span><span class="tag">&gt;</span>',
                '  <span class="tag">&lt;meta</span> <span class="attr">name</span>=<span class="str">"cipher"</span> <span class="attr">content</span>=<span class="str">"RPU-43-FRIRAGU"</span><span class="tag">&gt;</span>',
                '  <span class="tag">&lt;meta</span> <span class="attr">name</span>=<span class="str">"file-size"</span> <span class="attr">content</span>=<span class="str">"43x27"</span><span class="tag">&gt;</span>',
                '  <span class="tag">&lt;meta</span> <span class="attr">name</span>=<span class="str">"morse-hint"</span> <span class="attr">content</span>=<span class="str">"帖19"</span><span class="tag">&gt;</span>',
                '<span class="tag">&lt;/head&gt;</span>',
                '<span class="tag">&lt;body&gt;</span>',
                '  <span class="tag">&lt;div</span> <span class="attr">class</span>=<span class="str">"archive"</span><span class="tag">&gt;</span>',
                '    <span class="tag">&lt;!-- Base64: 5Zue5Z+N5qGj5qGI --&gt;</span>',
                '    <span class="tag">&lt;!-- Morse: -.-. .- -. / -.-- --- ..- / .... . .- .-. / -- . --&gt;</span>',
                '    <span class="tag">&lt;!-- ROT13: RPU-43-FRIRAGU --&gt;</span>',
                '    <span class="tag">&lt;!-- Key: 2347 --&gt;</span>',
                '  <span class="tag">&lt;/div&gt;</span>',
                '',
                '  <span class="comment">&lt;!-- 7 个节点，各藏一字：不 / 要 / 回 / 答 / 你 / 看 / 了 --&gt;</span>',
                '  <span class="comment">&lt;!-- 组合：不要回答 + 你看了 --&gt;</span>',
                '',
                '  <span class="comment">&lt;!-- 第43页的内容：你是第43页。 --&gt;</span>',
                '  <span class="hl">&lt;!-- 最终密码藏在 ROT13 里。 --&gt;</span>',
                '<span class="tag">&lt;/body&gt;</span>',
                '<span class="tag">&lt;/html&gt;</span>'
            ];
            srcBody.innerHTML = lines.join('\n');
        }

        if (Store.get('source_unlocked', false)) {
            renderSource();
        } else {
            srcBody.innerHTML =
                '<span class="comment">// 此文件已加密</span>\n' +
                '<span class="comment">// 请输入密钥解锁</span>\n\n' +
                '<div style="text-align:center;padding:20px;">' +
                '  <input type="text" id="srcKey" placeholder="密钥" style="padding:6px 12px;border:1px solid #888;width:200px;font-family:inherit;">' +
                '  <button class="old-btn" id="srcUnlock" style="margin-left:8px;">解锁</button>' +
                '  <p id="srcKeyMsg" style="color:#f66;font-size:12px;margin-top:10px;"></p>' +
                '  <p style="color:#666;font-size:11px;margin-top:20px;">提示：密钥在源代码里。</p>' +
                '</div>';

            document.getElementById('srcUnlock').addEventListener('click', function () {
                var v = document.getElementById('srcKey').value.trim();
                if (v === '2347') {
                    Store.set('source_unlocked', true);
                    renderSource();
                } else {
                    document.getElementById('srcKeyMsg').textContent = '密钥错误。';
                    document.getElementById('srcKey').value = '';
                }
            });
            document.getElementById('srcKey').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') document.getElementById('srcUnlock').click();
            });
        }

        document.getElementById('copyBtn').addEventListener('click', function () {
            var text = srcBody.innerText;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(function () { alert('已复制到剪贴板。'); });
            } else {
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                alert('已复制到剪贴板。');
            }
        });
    })();
    </script>
</body>
