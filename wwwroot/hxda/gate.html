<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>回响档案｜环境测试</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/main.css">
    <style>
        html, body {
            min-height: 100vh;
            background: #d8d8d8;
        }

        .gate-wrap {
            width: 720px;
            max-width: 96vw;
            margin: 40px auto;
        }

        .gate-box {
            background: #f4f4f4;
            border: 2px solid #888;
            font-family: "SimSun", "宋体", serif;
        }

        .gate-head {
            background: #1a3a6b;
            background-image: linear-gradient(to bottom, #4a6fa5 0%, #1a3a6b 100%);
            color: #fff;
            padding: 8px 14px;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #0d1b3e;
        }

        .gate-body {
            padding: 18px 22px;
            font-size: 13px;
            line-height: 2;
            color: #333;
        }

            .gate-body p {
                margin: 4px 0;
            }

        .gate-ok {
            color: #060;
            font-weight: bold;
        }

        .gate-warn {
            color: #a00;
            font-weight: bold;
        }

        .gate-tiny {
            font-size: 11px;
            color: #999;
        }

        .gate-actions {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .gate-scroll {
            max-height: 42vh;
            overflow-y: auto;
            padding: 14px 18px;
            background: #fafafa;
            border-bottom: 1px solid #ccc;
            font-size: 12px;
            line-height: 1.9;
            color: #333;
        }

            .gate-scroll h3 {
                font-size: 13px;
                color: #1a3a6b;
                margin: 12px 0 6px;
                border-bottom: 1px dashed #ccc;
                padding-bottom: 4px;
            }

                .gate-scroll h3:first-child {
                    margin-top: 0;
                }

            .gate-scroll p {
                margin: 4px 0;
            }

            .gate-scroll ul {
                margin: 4px 0 8px 20px;
            }

            .gate-scroll li {
                margin: 2px 0;
            }

            .gate-scroll .danger {
                color: #a00;
                font-weight: bold;
            }

        .gate-check {
            display: block;
            padding: 5px 0;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

            .gate-check input {
                margin-right: 6px;
            }

        #signCanvas {
            touch-action: none;
        }

        #adminDot {
            position: fixed;
            bottom: 8px;
            right: 10px;
            font-size: 10px;
            color: rgba(120, 120, 120, 0.18);
            cursor: default;
            user-select: none;
            font-family: "SimSun", "宋体", serif;
            padding: 6px 10px;
            transition: color 0.6s;
            z-index: 10;
        }

            #adminDot:hover {
                color: rgba(120, 120, 120, 0.3);
            }

        .gate-home-link {
            position: fixed;
            bottom: 10px;
            left: 12px;
            font-size: 11px;
            color: rgba(120, 120, 120, 0.55);
            text-decoration: none;
            font-family: "SimSun", "宋体", serif;
            padding: 4px 8px;
            transition: color 0.3s;
            z-index: 10;
        }

            .gate-home-link:hover {
                color: #1a3a6b;
                text-decoration: underline;
            }

        .orientation-block {
            position: fixed;
            inset: 0;
            background: #000;
            color: #eee;
            z-index: 999999;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: "SimSun", "宋体", serif;
            padding: 30px;
        }

            .orientation-block.active {
                display: flex;
            }

        .orientation-box {
            max-width: 320px;
        }

        .orientation-icon {
            font-size: 48px;
            margin-bottom: 20px;
            animation: rotateHint 2s ease-in-out infinite;
        }

        @keyframes rotateHint {
            0%, 100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(90deg);
            }
        }

        .orientation-title {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 14px;
            letter-spacing: 0.1em;
        }

        .orientation-text {
            font-size: 14px;
            line-height: 2;
            color: #aaa;
            margin-bottom: 16px;
        }

        .orientation-tiny {
            font-size: 11px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .orientation-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

            .orientation-actions button {
                padding: 6px 18px;
                background: #222;
                color: #ccc;
                border: 1px solid #555;
                font-family: inherit;
                font-size: 13px;
                cursor: pointer;
            }

                .orientation-actions button:hover {
                    background: #333;
                }

        /* 诡异低语：默认不可见，滚动到附近时浮现 */
        .gate-whisper {
            color: rgba(160, 0, 0, 0);
            font-size: 12px;
            line-height: 1.8;
            margin: 14px 0;
            transition: color 1.2s ease;
            font-style: italic;
        }

            .gate-whisper.show {
                color: rgba(160, 0, 0, 0.75);
            }
    </style>
</head>
