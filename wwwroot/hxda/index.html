<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>回响档案</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/main.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #intro {
            position: fixed;
            inset: 0;
            background: #000;
            color: #ccc;
            font-family: "SimSun", "宋体", serif;
            font-size: 18px;
            line-height: 2;
            padding: 12vh 10vw;
            white-space: pre-wrap;
            overflow: hidden;
            transition: opacity 2s ease;
            z-index: 1;
        }

            #intro .ch {
                opacity: 0;
                transition: opacity 0.08s;
            }

            #intro.fade {
                opacity: 0;
            }

        #skipBtn {
            position: fixed;
            bottom: 14px;
            right: 18px;
            color: #333;
            font-family: "SimSun", "宋体", serif;
            font-size: 12px;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 10;
            padding: 6px 12px;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

            #skipBtn:hover {
                color: #666;
            }

        #fsBtn {
            position: fixed;
            bottom: 14px;
            left: 18px;
            color: #222;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 10;
            padding: 6px 10px;
            transition: color 0.3s;
        }

            #fsBtn:hover {
                color: #555;
            }

        .horror-scanlines {
            position: fixed;
            inset: 0;
            z-index: 9997;
            pointer-events: none;
            background: repeating-linear-gradient( 0deg, rgba(0, 0, 0, 0.08) 0px, rgba(0, 0, 0, 0.08) 1px, transparent 1px, transparent 3px );
            mix-blend-mode: multiply;
            opacity: 0.5;
        }

        .horror-vignette {
            position: fixed;
            inset: 0;
            z-index: 9996;
            pointer-events: none;
            background: radial-gradient( circle at 50% 50%, transparent 0%, transparent 40%, rgba(0, 0, 0, 0.3) 75%, rgba(0, 0, 0, 0.6) 100% );
        }

        .noise-layer {
            position: fixed;
            inset: 0;
            z-index: 9995;
            pointer-events: none;
            opacity: 0.03;
            background-image: radial-gradient(rgba(255, 255, 255, 0.5) 1px, transparent 1px), radial-gradient(rgba(255, 255, 255, 0.3) 1px, transparent 1px);
            background-size: 3px 3px, 7px 7px;
            background-position: 0 0, 2px 2px;
            mix-blend-mode: screen;
            animation: noiseShift 1s steps(4) infinite;
        }

        @keyframes noiseShift {
            0% {
                background-position: 0 0, 2px 2px;
            }

            25% {
                background-position: 1px 2px, 3px 1px;
            }

            50% {
                background-position: 2px 1px, 1px 3px;
            }

            75% {
                background-position: 1px 3px, 2px 1px;
            }

            100% {
                background-position: 0 0, 2px 2px;
            }
        }
    </style>
</head>
<body>

    <div id="intro"></div>

    <div class="horror-scanlines"></div>
    <div class="horror-vignette"></div>
    <div class="noise-layer"></div>

    <button id="skipBtn">跳过 »</button>
    <button id="fsBtn" title="进入全屏">⛶</button>

    <script src="js/storage.js"></script>
    <script src="js/fullscreen.js"></script>
    <script>
(function () {

            'use strict';

            var NORMAL_TEXT =
                '凌晨 2:47。\n' +
                '你在一台旧笔记本上整理浏览器书签。窗外在下雨，手机没电，房间里只有风扇声。\n' +
                '你发现一个早就忘记来源的书签：\n' +
                'huixiang-dangan.net/bbs/\n' +
                '备注只有一句话：\n' +
                '"别删，等我回来。"\n' +
                '\n' +
                '你想不起来这是谁留的。\n' +
                '你点开了它。';

            var TRUE_ENDING_TEXT =
                '凌晨 2:47。\n' +
                '我在一台旧笔记本上整理浏览器书签。\n' +
                '我想不起来这是谁留的。\n' +
                '我点开了它。';

            var text = NORMAL_TEXT;
            var isTrueEnding = false;

            try {
                if (Store.get('ending_true', false)) {
                    text = TRUE_ENDING_TEXT;
                    isTrueEnding = true;
                }
            } catch (e) {}

            var audioRain = null;
            var audioFan = null;

            function startAmbient() {
                try {
                    audioRain = new Audio('audio/rain.wav');
                    audioRain.loop = true;
                    audioRain.volume = 0.1;
                    audioRain.play().catch(function () {});
                } catch (e) {}
                try {
                    audioFan = new Audio('audio/fan.wav');
                    audioFan.loop = true;
                    audioFan.volume = 0.05;
                    audioFan.play().catch(function () {});
                } catch (e) {}
            }

            function stopAmbient() {
                try {
                    if (audioRain) { audioRain.pause(); audioRain = null; }
                } catch (e) {}
                try {
                    if (audioFan) { audioFan.pause(); audioFan = null; }
                } catch (e) {}
            }

            var introEl = document.getElementById('intro');
            var index = 0;
            var startTime = Date.now();

            function type() {
                if (index < text.length) {
                    var ch = document.createElement('span');
                    ch.className = 'ch';

                    if (text[index] === '\n') {
                        ch.innerHTML = '<br>';
                    } else {
                        ch.textContent = text[index];
                    }

                    introEl.appendChild(ch);

                    requestAnimationFrame(function () {
                        ch.style.opacity = 1;
                    });

                    index++;

                    var lastCh = text[index - 1];
                    var delay = 50;
                    if (lastCh === '。' || lastCh === '，' || lastCh === '：') delay = 300;
                    else if (lastCh === '\n') delay = 600;

                    setTimeout(type, delay);

                } else {
                    setTimeout(function () {
                        introEl.classList.add('fade');

                        setTimeout(function () {
                            stopAmbient();

                            if (isTrueEnding) {
                                showTrueEndingQuestion();
                            } else {
                                window.location.href = 'welcome.html';
                            }
                        }, 2000);
                    }, 2000);
                }
            }

            function showTrueEndingQuestion() {
                introEl.classList.remove('fade');
                introEl.style.opacity = '1';
                introEl.innerHTML = '';
                introEl.style.padding = '20vh 10vw';
                introEl.style.textAlign = 'left';

                var line1 = document.createElement('div');
                line1.style.cssText = 'margin-bottom:24px;color:#ccc;font-size:18px;line-height:2;';
                line1.textContent = '你现在想起来了吗？';
                introEl.appendChild(line1);

                var btnWrap = document.createElement('div');
                btnWrap.style.cssText = 'display:flex;gap:16px;';

                var yesBtn = document.createElement('button');
                yesBtn.textContent = '是';
                yesBtn.style.cssText =
                    'padding:6px 28px;background:#222;color:#ccc;border:1px solid #555;' +
                    'font-family:inherit;font-size:16px;cursor:pointer;';
                yesBtn.addEventListener('click', function () {
                    line1.textContent = '你撒谎。';
                    btnWrap.remove();
                    setTimeout(function () { window.location.href = 'welcome.html'; }, 2500);
                });

                var noBtn = document.createElement('button');
                noBtn.textContent = '否';
                noBtn.style.cssText =
                    'padding:6px 28px;background:#222;color:#ccc;border:1px solid #555;' +
                    'font-family:inherit;font-size:16px;cursor:pointer;';
                noBtn.addEventListener('click', function () {
                    line1.textContent = '好。继续。';
                    btnWrap.remove();
                    setTimeout(function () { window.location.href = 'welcome.html'; }, 2500);
                });

                btnWrap.appendChild(yesBtn);
                btnWrap.appendChild(noBtn);
                introEl.appendChild(btnWrap);

                setTimeout(function () {
                    if (document.body.contains(btnWrap)) {
                        btnWrap.remove();
                        var hint = document.createElement('div');
                        hint.style.cssText =
                            'margin-top:32px;color:#888;font-size:14px;line-height:2;max-width:600px;';
                        hint.textContent =
                            '我知道你在想什么。你想不起来。因为这不是你留的。是它留给你。';
                        introEl.appendChild(hint);
                        setTimeout(function () { window.location.href = 'welcome.html'; }, 5000);
                    }
                }, 30000);
            }

            document.getElementById('skipBtn').addEventListener('click', function () {
                stopAmbient();
                try {
                    Store.set('visitor_name', '');
                    var a = Store.get('attention', 0) + 10;
                    Store.set('attention', a);
                } catch (e) {}
                window.location.href = 'welcome.html?skip=true';
            });

            document.getElementById('fsBtn').addEventListener('click', function () {
                if (window.FullscreenHelper) {
                    if (window.FullscreenHelper.isInFullscreen()) {
                        window.FullscreenHelper.exit();
                    } else {
                        window.FullscreenHelper.request();
                    }
                }
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === ' ' || e.key === 'Escape' || e.key === 'Enter') {
                    if (Date.now() - startTime < 3000) return;
                    document.getElementById('skipBtn').click();
                }
            });

            setTimeout(function () {
                startAmbient();
                type();
            }, 300);

            window.addEventListener('beforeunload', function () {
                stopAmbient();
            });

})();
    </script>
</body>
</html>
