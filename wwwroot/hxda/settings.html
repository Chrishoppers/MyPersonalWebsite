<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>回响档案｜设置</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .settings-page {
            width: 600px;
            max-width: 96vw;
            margin: 30px auto;
        }

        .settings-box {
            background: #f4f4f4;
            border: 2px solid #888;
            font-family: inherit;
        }

        .settings-title {
            background: #1a3a6b;
            background-image: linear-gradient(to bottom, #4a6fa5 0%, #1a3a6b 100%);
            color: #fff;
            padding: 8px 14px;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #0d1b3e;
        }

        .settings-body {
            padding: 18px 24px;
        }

        .settings-row {
            display: flex;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px dashed #ddd;
            font-size: 13px;
        }

            .settings-row:last-of-type {
                border-bottom: none;
            }

            .settings-row .lbl {
                width: 100px;
                color: #333;
                font-weight: bold;
                flex-shrink: 0;
                padding-top: 2px;
            }

            .settings-row .opts {
                flex: 1;
            }

                .settings-row .opts label {
                    margin-right: 18px;
                    cursor: pointer;
                    user-select: none;
                }

                .settings-row .opts input[type="radio"] {
                    margin-right: 3px;
                }

            .settings-row input[type="text"] {
                width: 100%;
                padding: 4px 8px;
                border: 1px solid #888;
                background: #fff;
                font-family: inherit;
                font-size: 13px;
            }

        .settings-tiny {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            line-height: 1.5;
        }

        .settings-actions {
            padding: 12px 24px 20px;
            text-align: right;
            border-top: 1px solid #ddd;
            background: #ececec;
        }

            .settings-actions .old-btn {
                margin-left: 8px;
            }

        #notifyBadge {
            position: fixed;
            top: 12px;
            right: 12px;
            background: #a00;
            color: #fff;
            padding: 8px 14px;
            font-family: SimSun, serif;
            font-size: 12px;
            cursor: pointer;
            z-index: 9998;
            max-width: 260px;
            line-height: 1.5;
            border: 2px outset #c33;
        }
    </style>
</head>
<body>

    <div class="forum-wrap" style="min-height: auto;">

        <div class="forum-head">
            <div class="head-logo"></div>
            <div class="head-right">
                <div class="user-info" id="userInfo">游客</div>
            </div>
        </div>

        <div class="forum-nav">
            <a href="bbs.html">← 返回论坛</a>
            <a href="bbs.html">首页</a>
            <a href="settings.html" class="active">设置</a>
        </div>

        <div class="settings-page">
            <div class="settings-box" id="settingsBox">
                <div class="settings-title" id="settingsTitle">设置</div>
                <div class="settings-body">

                    <div class="settings-row">
                        <span class="lbl">主题：</span>
                        <div class="opts" id="themeOpts">
                            <label><input type="radio" name="theme" value="light"> 浅色</label>
                            <label><input type="radio" name="theme" value="dark"> 深色</label>
                        </div>
                    </div>

                    <div class="settings-row">
                        <span class="lbl">字体大小：</span>
                        <div class="opts" id="fontOpts">
                            <label><input type="radio" name="font" value="small"> 小</label>
                            <label><input type="radio" name="font" value="medium"> 中</label>
                            <label><input type="radio" name="font" value="large"> 大</label>
                        </div>
                    </div>

                    <div class="settings-row">
                        <span class="lbl">提醒：</span>
                        <div class="opts" id="notifyOpts">
                            <label><input type="radio" name="notify" value="on"> 开</label>
                            <label><input type="radio" name="notify" value="off"> 关</label>
                        </div>
                    </div>

                    <div class="settings-row">
                        <span class="lbl">签名：</span>
                        <div class="opts">
                            <input type="text" id="signInput" maxlength="40" placeholder="你的签名..." autocomplete="off">
                            <div class="settings-tiny" id="signTiny">签名会出现在你所有的帖子底部。</div>
                        </div>
                    </div>

                </div>
                <div class="settings-actions">
                    <button class="old-btn" id="btnBack">← 返回论坛</button>
                    <button class="old-btn old-btn-primary" id="btnSave">保存</button>
                    <button class="old-btn" id="btnCancel">取消</button>
                </div>
            </div>
        </div>

    </div>

    <script src="js/storage.js"></script>
    <script src="js/fullscreen.js"></script>
    <script src="js/tracker.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/horror.js"></script>

    <script>
(function () {

            'use strict';

            function escapeHtml(s) {
                var d = document.createElement('div');
                d.textContent = String(s);
                return d.innerHTML;
            }

            var box        = document.getElementById('settingsBox');
            var titleEl    = document.getElementById('settingsTitle');
            var themeOpts  = document.getElementById('themeOpts');
            var fontOpts   = document.getElementById('fontOpts');
            var notifyOpts = document.getElementById('notifyOpts');
            var signInput  = document.getElementById('signInput');
            var signTiny   = document.getElementById('signTiny');

            (function () {
                var userInfo = document.getElementById('userInfo');
                if (userInfo) {
                    var name = Store.get('visitor_name', '');
                    if (name) userInfo.innerHTML = '<b>' + escapeHtml(name) + '</b>';
                }
            })();

            if (window.FullscreenHelper && !window.FullscreenHelper.isMobile) {
                var fsBtn = document.createElement('button');
                fsBtn.textContent = '⛶';
                fsBtn.title = '进入全屏';
                fsBtn.style.cssText =
                    'position:fixed;bottom:14px;left:18px;' +
                    'color:#666;font-family:monospace;font-size:14px;' +
                    'cursor:pointer;background:none;border:none;padding:4px 8px;' +
                    'z-index:99998;';
                fsBtn.addEventListener('click', function () {
                    if (window.FullscreenHelper.isInFullscreen()) {
                        window.FullscreenHelper.exit();
                    } else {
                        window.FullscreenHelper.request();
                    }
                });
                document.body.appendChild(fsBtn);
            }

            var openCount = Store.get('settings_opened_count', 0) + 1;
            Store.set('settings_opened_count', openCount);
            if (openCount >= 2) titleEl.textContent = '你回来了。';

            var darkMode = Store.get('dark_mode', false);
            document.querySelector('input[name="theme"][value="' + (darkMode ? 'dark' : 'light') + '"]').checked = true;
            if (darkMode) document.body.classList.add('dark-mode');

            var fontSize = Store.get('font_size', 'medium');
            document.querySelector('input[name="font"][value="' + fontSize + '"]').checked = true;
            applyFontSize(fontSize);

            var notifyOn = Store.get('notify_on', false);
            document.querySelector('input[name="notify"][value="' + (notifyOn ? 'on' : 'off') + '"]').checked = true;

            signInput.value = Store.get('signature', '');

            var themeCount = Store.get('theme_switch_count', 0);
            var themeLocked = Store.get('theme_locked', false);
            if (themeLocked) lockTheme();

            document.querySelectorAll('input[name="theme"]').forEach(function (r) {
                r.addEventListener('change', function () {
                    if (themeLocked) return;
                    themeCount++;
                    Store.set('theme_switch_count', themeCount);

                    var dark = r.value === 'dark';
                    Store.set('dark_mode', dark);

                    if (dark) {
                        document.body.classList.add('dark-mode');
                        Store.set('seen_hidden_text_dark', true);
                    } else {
                        document.body.classList.remove('dark-mode');
                    }

                    if (themeCount === 3) uiAlert('设置', '你选好了吗？');
                    if (themeCount >= 5) lockTheme();
                });
            });

            function lockTheme() {
                themeLocked = true;
                Store.set('theme_locked', true);
                themeOpts.querySelectorAll('input').forEach(function (i) { i.disabled = true; });

                if (!document.getElementById('themeLockText')) {
                    var t = document.createElement('div');
                    t.id = 'themeLockText';
                    t.className = 'settings-tiny';
                    t.style.color = '#a00';
                    t.textContent = '已经来不及了。';
                    themeOpts.appendChild(t);
                }
            }

            var fontCount = Store.get('font_switch_count', 0);
            var fontLocked = Store.get('font_locked', false);
            if (fontLocked) lockFont();

            document.querySelectorAll('input[name="font"]').forEach(function (r) {
                r.addEventListener('change', function () {
                    if (fontLocked) return;
                    fontCount++;
                    Store.set('font_switch_count', fontCount);
                    Store.set('font_size', r.value);
                    applyFontSize(r.value);

                    if (r.value === 'large') Store.set('font_large_hint', true);
                    if (r.value === 'small') Store.set('font_small_post5_big', true);

                    if (fontCount === 3) startFontDrift();
                    if (fontCount >= 5) lockFont();
                });
            });

            function applyFontSize(v) {
                document.documentElement.style.fontSize =
                    v === 'small' ? '12px' :
                    v === 'large' ? '16px' : '14px';
            }

            function startFontDrift() {
                if (window._fontDrift) return;
                window._fontDrift = true;
                var step = 0;

                var timer = setInterval(function () {
                    step++;
                    document.documentElement.style.fontFamily =
                        step % 2 === 0
                            ? '"SimSun","宋体",serif'
                            : '"Times New Roman",serif';
                    if (step >= 6) {
                        clearInterval(timer);
                        window._fontDrift = false;
                    }
                }, 2500);
            }

            function lockFont() {
                fontLocked = true;
                Store.set('font_locked', true);
                fontOpts.querySelectorAll('input').forEach(function (i) { i.disabled = true; });
                document.documentElement.style.fontSize = '10px';

                if (!document.getElementById('fontLockText')) {
                    var t = document.createElement('div');
                    t.id = 'fontLockText';
                    t.className = 'settings-tiny';
                    t.style.color = '#a00';
                    t.textContent = '你看不清了。';
                    fontOpts.appendChild(t);
                }
            }

            var notifyCount = Store.get('notify_switch_count', 0);
            var notifyLocked = Store.get('notify_locked', false);
            if (notifyLocked) lockNotify();

            document.querySelectorAll('input[name="notify"]').forEach(function (r) {
                r.addEventListener('change', function () {
                    if (notifyLocked) return;
                    notifyCount++;
                    Store.set('notify_switch_count', notifyCount);

                    var on = r.value === 'on';
                    Store.set('notify_on', on);

                    if (on) {
                        showNotifyBadge('你有1条未读消息。来自：阿回。内容："有人吗。"');
                    } else {
                        hideNotifyBadge();
                        setTimeout(function () {
                            if (!notifyLocked) {
                                showNotifyBadge('你有1条未读消息。来自：阿回。内容："有人吗。"');
                            }
                        }, 30000);
                    }

                    if (notifyCount === 3) showNotifyBadge('你有1条未读消息。来自：你。内容："别关。"');
                    if (notifyCount >= 5) lockNotify();
                });
            });

            function showNotifyBadge(text) {
                hideNotifyBadge();
                var el = document.createElement('div');
                el.id = 'notifyBadge';
                el.textContent = '🔔 ' + text;
                el.addEventListener('click', function () { el.remove(); });
                document.body.appendChild(el);
            }

            function hideNotifyBadge() {
                var el = document.getElementById('notifyBadge');
                if (el) el.remove();
            }

            function lockNotify() {
                notifyLocked = true;
                Store.set('notify_locked', true);
                notifyOpts.querySelectorAll('input').forEach(function (i) { i.disabled = true; });
                showNotifyBadge('你关不掉。');
            }

            signInput.addEventListener('input', function () {
                var v = signInput.value;

                if (v === '有人吗') {
                    signInput.value = '';
                    signTiny.textContent = '这不是签名。这是问题。';
                    signTiny.style.color = '#a00';
                    return;
                }

                var myName = Store.get('visitor_name', '');
                if (myName && v === myName) {
                    signInput.value = '';
                    signTiny.textContent = '你已经在了。不需要签名。';
                    signTiny.style.color = '#a00';
                    return;
                }

                if (v === '') {
                    signTiny.textContent = '无名者无需签名。请继续保持。';
                    signTiny.style.color = '#999';
                } else {
                    signTiny.textContent = '签名会出现在你所有的帖子底部。';
                    signTiny.style.color = '#999';
                }
            });

            document.getElementById('btnSave').addEventListener('click', function () {
                Store.set('sign_saved', true);
                Store.set('signature', signInput.value);
                signInput.disabled = true;
                signTiny.textContent = '已归档。';
                signTiny.style.color = '#a00';

                setTimeout(function () {
                    uiAlert(
                        '设置已保存',
                        '保存后无法修改。\n但你可以不保存。'
                    );
                }, 300);
            });

            document.getElementById('btnSave').title = '保存后无法修改。但你可以不保存。';

            document.getElementById('btnCancel').addEventListener('click', function () {
                var t = document.createElement('div');
                t.style.cssText =
                    'position:fixed;bottom:50px;left:50%;transform:translateX(-50%);' +
                    'color:#888;font-size:12px;font-family:SimSun,serif;' +
                    'background:#fff8d0;padding:6px 14px;border:1px dashed #d8c878;' +
                    'z-index:9999;';
                t.textContent = '你取消了。它记住了。';
                document.body.appendChild(t);

                setTimeout(function () {
                    t.remove();
                    window.location.href = 'bbs.html';
                }, 2000);
            });

            document.getElementById('btnBack').addEventListener('click', function () {
                window.location.href = 'bbs.html';
            });

            setTimeout(function () {
                box.classList.add('shake');
                setTimeout(function () { box.classList.remove('shake'); }, 500);
            }, 12000);

            setTimeout(function () {
                uiAlert('你设置好了吗？', '它等不及了。', function () {
                    window.location.href = 'bbs.html';
                });
            }, 18000);

})();
    </script>

</body>
</html>
