            max-width: 760px;

            .post-detail .post-head {
                background: #e0e0e0;
                background-image: linear-gradient(to bottom, #f4f4f4 0%, #e0e0e0 100%);

                padding: 10px 16px;

                color: #1a3a6b;
            }

            .post-detail .post-meta {
                font-size: 11px;
                color: #888;
                padding: 6px 16px;
                background: #fafafa;
                border-bottom: 1px dashed #ddd;
            }

            .post-detail .post-body {
                padding: 16px 20px;
                font-size: 13px;
                line-height: 2;
                color: #333;
                white-space: pre-wrap;
            }

        .attachment-area {
            padding: 10px 20px 16px;
            border-top: 1px dashed #eee;
            background: #fafafa;
        }

            .attachment-area .att-label {
                font-size: 11px;
                color: #888;
                margin-bottom: 6px;
            }

        .attachment-thumb {
            display: inline-block;
            border: 1px solid #888;
            padding: 3px;
            background: #f4f4f4;
            cursor: pointer;
            margin-right: 10px;
            vertical-align: top;
        }

            .attachment-thumb:hover {
                border-color: #1a3a6b;
            }

            .attachment-thumb img {
                display: block;
                max-width: 200px;
                max-height: 150px;
            }

            .attachment-thumb .att-name {
                font-size: 11px;
                color: #666;
                text-align: center;
                margin-top: 3px;
                max-width: 200px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

        .att-img-wrap {
            position: relative;
            display: inline-block;
        }

        .att-signature {
            position: absolute;
            right: 6%;
            bottom: 8%;
            width: 38%;
            max-width: 120px;
            opacity: 0.75;
            transform: rotate(-6deg) skew(-4deg, 2deg);
            pointer-events: none;
            mix-blend-mode: multiply;
            filter: contrast(1.2);
        }

        .audio-att {
            display: inline-block;
            padding: 6px 14px;
            border: 1px solid #888;
            background: #f4f4f4;
            cursor: pointer;
            font-size: 12px;
            color: #1a3a6b;
            margin-top: 6px;
        }

            .audio-att:hover {
                background: #fff8d0;
            }

            .audio-att::before {
                content: '🔊 ';
            }

        .replies {
            border-top: 1px solid #aaa;
        }

        .replies-title {
            background: #e0e0e0;
            background-image: linear-gradient(to bottom, #f4f4f4 0%, #e0e0e0 100%);
            border-bottom: 1px solid #aaa;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            color: #1a3a6b;
        }

        .reply {
            padding: 10px 16px;
            border-bottom: 1px dashed #ddd;
            font-size: 12px;
            line-height: 1.9;
        }

            .reply:last-child {
                border-bottom: none;
            }

            color: #1a3a6b;
            font-weight: bold;

            font-weight: bold;
            color: #333;

            function renderPost(p, id) {
                var html = '';

                html += '<div class="post-head">' + escapeHtml(p.title) + '</div>';

                html += '<div class="post-meta">';
                if (p.author === '林默') {
                    html += '发帖人：<a href="pm.html" id="sendPMLink" style="color:#1a3a6b;">林默</a>';
                } else {
                    html += '发帖人：' + escapeHtml(p.author);
                }
                html += ' ' + escapeHtml(p.time) + '</div>';

                html += '<div class="post-body">' + p.body.replace(/\n/g, '<br>') + '</div>';

                if (p.attachment && p.attachment.type === 'image') {
                    html += '<div class="attachment-area">';
                    html += '<div class="att-label">附件：</div>';
                    html += '<div class="attachment-thumb" id="attImage" data-src="' + p.attachment.src + '">';
                    html += '  <div class="att-img-wrap">';
                    html += '    <img src="' + p.attachment.src + '" alt="' + p.attachment.name + '" id="attMainImg">';
                    html += '    <img id="attSignature" class="att-signature" src="" alt="" style="display:none;">';
                    html += '  </div>';
                    html += '  <div class="att-name">' + p.attachment.name + '</div>';
                    html += '</div>';
                    html += '</div>';
                }

                if (p.audioAttachment) {
                    if (!p.attachment) {
                        html += '<div class="attachment-area">';
                        html += '<div class="att-label">附件：</div>';
                    }
                    html += '<div class="audio-att" id="attAudio">' + escapeHtml(p.audioAttachment.name) + '</div>';
                    if (!p.attachment) { html += '</div>'; }
                }

                if (p.replies && p.replies.length) {
                    html += '<div class="replies">';
                    html += '<div class="replies-title">回复列表（共 ' + p.replies.length + ' 条）</div>';

                        var content = escapeHtml(r[1]);

                        if (id === '1' && i === 22) {
                            if (refreshCount >= 1) { content += '<br><span class="reply-anomaly">它写的是你的名字。</span>'; }
                            if (refreshCount >= 2) { content += '<br><span class="reply-anomaly">' + escapeHtml(playerName || '无名') + '</span>'; }
                            if (refreshCount >= 3) { content += '<br><span class="reply-anomaly">你来了。</span>'; }
                        }

                        if (id === '2' && i === 0) {
                            if (refreshCount === 1) { content = '阿回不在了。'; }
                            else if (refreshCount === 2) { content = '阿回在你后面。'; }
                            else if (refreshCount >= 3) { content = '阿回是版主吧？。'; }
                        }

                        html += '<div class="reply" data-floor="' + (i + 1) + '">';
                        html += '<span class="reply-floor">#' + (i + 1) + '</span> ';
                        html += '<span class="reply-who">' + escapeHtml(r[0]) + '</span>';
                        html += '<span class="reply-time">' + escapeHtml(r[2]) + '</span>';
                        html += '<div class="reply-content">' + content + '</div>';
                        html += '</div>';
                    });

                    html += '</div>';
                }

                detailEl.innerHTML = html;

                var attMainImg = document.getElementById('attMainImg');
                if (attMainImg) {
                    attMainImg.onerror = function () {
                        this.style.display = 'none';
                        var wrap = this.parentNode;
                        var placeholder = document.createElement('div');
                        placeholder.style.cssText = 'width:200px;height:150px;background:#ddd;display:flex;align-items:center;justify-content:center;color:#666;font-size:11px;flex-direction:column;text-align:center;';
                        placeholder.innerHTML = '图片未提供<br>（仍可点击）';
                        wrap.insertBefore(placeholder, this.nextSibling);
                    };
                }

                var attImage = document.getElementById('attImage');
                if (attImage) {
                    attImage.addEventListener('click', function () {
                        var src = this.dataset.src || 'img/notebook_default.jpg';
                        if (window.ViewerHelper) { window.ViewerHelper.openImage('notebook_default.jpg', src); }
                    });
                }

                var attAudio = document.getElementById('attAudio');
                if (attAudio) {
                    attAudio.addEventListener('click', function () {
                        if (window.ViewerHelper) { window.ViewerHelper.openAudio(); }
                    });
                }

                if (id === '3') {
                    var tt1 = document.getElementById('tt-liukong');
                    var tt2 = document.getElementById('tt-yourenma');
                    var tt3 = document.getElementById('tt-buhuitou');

                    if (tt1) {
                        tt1.title = '留空者不被归档。但留空者也不被忘记。';
                        tt1.addEventListener('mouseenter', function () {
                            Store.set('tooltip_liukong_seen', true);
                            addAttention(1);
                        });
                    }
                    if (tt2) {
                        tt2.title = '已经回答了 7 次。你是第 8 个。';
                        tt2.addEventListener('mouseenter', function () {
                            Store.set('tooltip_yourenma_seen', true);
                            addAttention(1);
                        });
                    }
                    if (tt3) {
                        tt3.title = '你已经回头了。你在看这句话的时候，就回头了。';
                        tt3.addEventListener('mouseenter', function () {
                            Store.set('tooltip_buhuitou_seen', true);
                            Store.set('discovered_page43', true);
                            addAttention(1);
                        });
                    }

                    Store.set('read_post_3', true);
                }

                if (id === '4' && p.special === 'post4') {
                    var adminUrl = params.get('admin');
                    if (adminUrl === 'true') {
                        Store.set('post4_admin_url', true);
                        setTimeout(function () {
                            uiAlert('隐藏入口',
                                '你找到了隐藏入口。\n' +
                                '但你不是管理员。\n' +
                                '你只是访客。\n' +
                                '访客不能被归档。\n' +
                                '但访客可以被记住。');
                        }, 800);
                    } else {
                        setTimeout(function () {
                            uiPopup('需要权限',
                                '此帖内容需要管理员权限。\n' +
                                '您不是管理员。\n' +
                                '但您可以成为管理员。\n' +
                                '输入指令：become admin',
                                [{
                                    text: '确定', primary: true,
                                    onClick: function () {
                                        Store.set('become_admin_hint', true);
                                        Store.set('discovered_become_admin', true);
                                    }
                                }]);
                        }, 2000);
                    }
                    Store.set('read_post_4', true);
                    Store.set('post4_visited', true);
                }

                if (id === '1') Store.set('read_post_1', true);
                if (id === '2') Store.set('read_post_2', true);

                if (id === '2') {
                    var replies = detailEl.querySelectorAll('.reply');
                    if (replies[1]) {
                        replies[1].title = '最后编辑：2019-01-03 02:19 / 编辑者：阿回';
                    }
                }

                var sendPMLink = document.getElementById('sendPMLink');
                if (sendPMLink) {
                    sendPMLink.addEventListener('click', function (e) {
                        e.preventDefault();
                        window.location.href = 'pm.html';
                    });
                }

                if (id === '1') {
                    var sigImg = document.getElementById('attSignature');
                    if (sigImg) {
                        var sigData = Store.get('gate_signature_image', '');
                        if (sigData) {
                            sigImg.src = sigData;
                            sigImg.style.display = 'block';
                        }
                    }
                }

                if (window.HxdaReport && window.HxdaReport.event) {
                    HxdaReport.event('post_read', { id: id });
                }
            }

            (function () {
                var userInfo = document.getElementById('userInfo');
                if (userInfo) {
                    var name = Store.get('gate_signature_name', '') || Store.get('visitor_name', '');
                    if (name) { userInfo.innerHTML = '<b>' + escapeHtml(name) + '</b>'; }
                }
            })();

            if (window.FullscreenHelper && !window.FullscreenHelper.isMobile) {
                var fsBtn = document.createElement('button');
                fsBtn.textContent = '⛶';
                fsBtn.title = '进入全屏';
                fsBtn.style.cssText = 'position:fixed;bottom:14px;left:18px;color:#666;font-family:monospace;font-size:14px;cursor:pointer;background:none;border:none;padding:4px 8px;z-index:99998;';
                fsBtn.addEventListener('click', function () {
                    if (window.FullscreenHelper.isInFullscreen()) { window.FullscreenHelper.exit(); }
                    else { window.FullscreenHelper.request(); }
                });
                document.body.appendChild(fsBtn);
            }
})();
    </script>

</body>
</html>
